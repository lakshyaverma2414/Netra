pattern:
  description: Entities sharing a common identifier (phone, email, etc).
  id: shared_identifier
  parameters:
    minimum_entities: 2
  query_template: "\n                SELECT r1.target_entity_id as identifier, COUNT(DISTINCT\
    \ r1.source_entity_id) as entity_count\n                FROM relationships r1\n\
    \                WHERE r1.relationship_type = 'USES'\n                GROUP BY\
    \ r1.target_entity_id\n                HAVING COUNT(DISTINCT r1.source_entity_id)\
    \ >= :minimum_entities\n            "
