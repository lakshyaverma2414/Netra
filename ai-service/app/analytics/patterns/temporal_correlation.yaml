pattern:
  description: Find relationships occurring within a tight time window.
  id: temporal_correlation
  parameters: {}
  query_template: "\n                SELECT r1.relationship_id as rel1, r2.relationship_id\
    \ as rel2\n                FROM relationships r1\n                JOIN relationships\
    \ r2 ON r1.target_entity_id = r2.target_entity_id\n                WHERE r1.relationship_id\
    \ != r2.relationship_id \n                /* Mocking temporal overlap for now\
    \ */\n            "
