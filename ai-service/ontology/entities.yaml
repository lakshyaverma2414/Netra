netra:Entity:
  label: Entity
  description: Base domain object.
  version: "1.0"
netra:Actor:
  label: Actor
  parent: netra:Entity
  description: An entity capable of action.
netra:Person:
  label: Person
  parent: netra:Actor
  description: A human being.
netra:Organization:
  label: Organization
  parent: netra:Actor
  description: A formal group or agency.
netra:Group:
  label: Group
  parent: netra:Actor
  description: An informal collective or syndicate.
netra:DigitalObject:
  label: Digital Object
  parent: netra:Entity
